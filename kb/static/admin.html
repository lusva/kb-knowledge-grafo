<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Configurazione — NIKI</title>
<link rel="icon" type="image/png" sizes="32x32" href="/marchio/favicon-32.png">
<link rel="apple-touch-icon" href="/marchio/apple-touch-icon.png">
<meta name="theme-color" content="#7C3AED">
<link rel="stylesheet" href="/font/fonts.css">
<link rel="stylesheet" href="/app/admin.css">
<link rel="stylesheet" href="/app/dialogo.css">
<link rel="stylesheet" href="/app/elenco.css">
</head>
<body>

<nav class="pagine" aria-label="Amministrazione">
  <a class="home" href="/" title="Torna alla knowledge">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
    <img src="/marchio/logo-96.png" alt="" width="22" height="22"><span>NIKI</span>
  </a>
  <a class="current" href="/config" aria-current="page">Impostazioni</a>
</nav>

<main>
  <header>
    <h1>Impostazioni</h1>
    <p class="sub">Le modifiche hanno effetto subito, senza riavviare il server.
    Un campo lasciato vuoto usa il valore predefinito, mostrato in grigio.</p>
  </header>

  <div class="layout">
    <aside id="indice" aria-label="Sezioni delle impostazioni">
      <div class="cerca">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="cerca" type="search" placeholder="Cerca un'impostazione…" aria-label="Cerca un'impostazione"
               autocomplete="off" spellcheck="false">
      </div>
      <nav id="indice-voci"></nav>
      <p id="models-note"></p>
    </aside>

    <div id="cfg-body" aria-live="polite">Carico…</div>
  </div>
</main>

<div id="footer">
  <div class="inner">
    <span id="msg" aria-live="polite"></span>
    <button id="btn-reset" title="Toglie tutte le personalizzazioni e torna ai valori predefiniti">Ripristina tutto</button>
    <button class="primary" id="btn-save" disabled>Salva</button>
  </div>
</div>

<script src="/app/elenco.js"></script>
<script src="/app/dialogo.js"></script>
<script src="/app/admin.js"></script>
</body>
</html>
